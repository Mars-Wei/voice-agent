[project]
name = "voice-control-human-robot-tool-python"
description = "A tool extension for controlling a humanoid robot via voice commands - action control and TTS"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pytest", "aiohttp>=3.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
