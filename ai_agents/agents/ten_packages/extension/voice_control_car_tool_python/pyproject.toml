[project]
name = "voice-control-car-tool-python"
description = "A tool extension for controlling a car via voice commands through WebSocket"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pytest", "websockets>=12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
